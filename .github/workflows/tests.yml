name: installer-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Validate installer and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh
      - name: Check installer help
        run: bash install.sh --help
      - name: Check checksum and platform gates
        run: |
          grep -q 'shasum -a 256' install.sh
          grep -q 'DevCut-Studio-v0.9.1-OWNER' install.sh
          grep -q 'DevCut-Studio-v0.9.1-CUSTOMER' install.sh
          grep -q 'currently supports macOS only' install.sh
      - name: Check whitespace errors
        run: git diff --check
